name: NorthAmTrack Weekly Digest Draft

on:
  schedule:
    - cron: "*/10 * * * *"

  workflow_dispatch:

jobs:
  prepare-weekly-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Prepare weekly digest draft
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node scripts/prepare-weekly-digest.js

      - name: Upload weekly digest draft
        uses: actions/upload-artifact@v4
        with:
          name: northamtrack-weekly-digest-draft
          path: |
            output/weekly-digest-draft.html
            output/weekly-digest-draft.json
          retention-days: 14
