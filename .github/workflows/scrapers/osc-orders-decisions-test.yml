name: OSC Orders Decisions Test

on:
  workflow_dispatch:

jobs:
  test-osc-decisions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run OSC Orders Decisions diagnostic
        run: node scrapers/osc-orders-decisions-test.js
